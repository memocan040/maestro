[package]
name = "maestro-protocol"
version = "0.35.1"
edition = "2021"

[dependencies]
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "rt"] }

[features]
bindings = ["dep:specta"]

[dependencies.specta]
version = "2.0.0-rc.20"
optional = true
features = ["serde_json"]
